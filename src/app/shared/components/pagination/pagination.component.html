<div class="d-flex justify-content-between align-items-center flex-wrap">

  <!-- Page Info -->
  <div class="mb-2">
    Page {{ currentPage }} of {{ totalPages }}
  </div>

  <!-- Jump to Page -->
  <div class="mb-2">
    <input
      type="number"
      [(ngModel)]="jumpPage"
      (keyup.enter)="jumpToPage()"
      class="form-control form-control-sm d-inline-block"
      style="width: 80px"
      placeholder="Page"
    />
    <button class="btn btn-primary btn-sm ms-1" (click)="jumpToPage()">Go</button>
  </div>
</div>

<!-- Pagination Bar -->
<ul class="pagination pagination-sm justify-content-center mt-2">

  <li class="page-item" [class.disabled]="currentPage === 1">
    <button class="page-link" (click)="goToFirst()">« First</button>
  </li>

  <li class="page-item" [class.disabled]="currentPage === 1">
    <button class="page-link" (click)="goToPrev()">‹ Prev</button>
  </li>

  <li class="page-item disabled" *ngIf="pageWindow[0] > 1">
    <span class="page-link">...</span>
  </li>

  <li class="page-item"
      *ngFor="let p of pageWindow"
      [class.active]="p === currentPage">
    <button class="page-link" (click)="setPage(p)">{{ p }}</button>
  </li>

  <li class="page-item disabled" *ngIf="pageWindow[pageWindow.length - 1] < totalPages">
    <span class="page-link">...</span>
  </li>

  <li class="page-item" [class.disabled]="currentPage === totalPages">
    <button class="page-link" (click)="goToNext()">Next ›</button>
  </li>

  <li class="page-item" [class.disabled]="currentPage === totalPages">
    <button class="page-link" (click)="goToLast()">Last »</button>
  </li>

</ul>
