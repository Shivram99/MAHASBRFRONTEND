<div class="container mt-4">

  <div class="d-flex justify-content-between mb-3">
    <h4 class="fw-bold text-primary">Role Management</h4>
    <button class="btn btn-success btn-sm" (click)="startAdd()">Add Role</button>
  </div>

  <!-- Add/Edit Form -->
  <div *ngIf="showForm" class="card p-3 mb-3 shadow-sm">

    <h5>{{ isEditMode ? 'Edit Role' : 'Add Role' }}</h5>

    <form [formGroup]="roleForm">
      <div class="mb-3">
        <label class="form-label">Role Name *</label>
        <input type="text" class="form-control" formControlName="name">
      </div>

      <button class="btn btn-primary btn-sm" (click)="save()">Save</button>
      <button class="btn btn-warning btn-sm ms-2" (click)="cancel()">Cancel</button>
    </form>
  </div>

  <!-- Search -->
  <div class="mb-3">
    <input 
      type="text" 
      class="form-control form-control-sm" 
      placeholder="Search roles..." 
      [(ngModel)]="searchText"
      (input)="onSearch()">
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Role Name</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of pagedRoles; let i = index">
          <td>{{ ((currentPage - 1) * pageSize) + i + 1 }}</td>
          <td>{{ r.name }}</td>

          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-2" (click)="edit(r)">
              <i class="bi bi-pencil-square"></i>
            </button>

            <button class="btn btn-outline-danger btn-sm" (click)="delete(r)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="pagedRoles.length === 0">
          <td colspan="3" class="text-center text-muted py-3">
            No roles found
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <app-pagination
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    (pageChanged)="setPage($event)">
  </app-pagination>

</div>
