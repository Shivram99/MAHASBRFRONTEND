<!-- src/app/common-post-login/components/nic/nicgroup-list/nicgroup-list.component.html -->
<div class="container-fluid mt-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-primary mb-2">NIC Group List</h4>

    <button class="btn btn-success btn-sm px-3 mb-2" (click)="startAdd()">
      <i class="bi bi-plus-circle"></i> Add Group
    </button>
  </div>

  <!-- Inline Form -->
  <div *ngIf="showForm" class="card p-3 mb-3 shadow-sm">
    <h5 class="mb-3">{{ isEditMode ? 'Edit Group' : 'Add Group' }}</h5>

    <form [formGroup]="groupForm">
      <div class="row g-3">
        <div class="col-md-4 col-sm-6">
          <label class="form-label">Group Code *</label>
          <input class="form-control" formControlName="groupCode" [readonly]="isEditMode" />
        </div>

        <div class="col-md-6 col-sm-6">
          <label class="form-label">Description *</label>
          <input class="form-control" formControlName="description" />
        </div>

        <div class="col-md-4 col-sm-6">
          <label class="form-label">Division *</label>
          <select class="form-select" formControlName="divisionCode">
            <option value="">Select Division</option>
            <option *ngFor="let d of divisions" [value]="d.divisionCode">
              {{ d.divisionCode }} - {{ d.description }}
            </option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <button class="btn btn-primary btn-sm" (click)="saveGroup()">Save</button>
        <button class="btn btn-warning btn-sm ms-2" (click)="cancelForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Filters -->
  <div class="row g-3 mb-3">
    <div class="col-md-4 col-sm-6">
      <input type="text" class="form-control form-control-sm"
             placeholder="Search by code or description"
             [(ngModel)]="searchText"
             (input)="onSearchChange()" />
    </div>

    <div class="col-md-4 col-sm-6">
      <select class="form-select form-select-sm" [(ngModel)]="selectedDivision" (change)="filterByDivision()">
        <option value="">All divisions</option>
        <option *ngFor="let d of divisions" [value]="d.divisionCode">
          {{ d.divisionCode }} - {{ d.description }}
        </option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Group Code</th>
          <th>Description</th>
          <th>Division</th>
          <th>Status</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let g of pagedGroups; let i = index">
          <td>{{ ((currentPage - 1) * pageSize) + i + 1 }}</td>
          <td>{{ g.groupCode }}</td>
          <td>{{ g.description }}</td>
          <td>{{ g.divisionCode }}</td>
          <td>
            <span class="badge px-2 py-1" [class.bg-success]="g.isActive === 'Y'" [class.bg-danger]="g.isActive === 'N'">
              {{ g.isActive === 'Y' ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-2" (click)="editGroup(g)">
              <i class="bi bi-pencil-square"></i>
            </button>

            <button class="btn btn-sm" [class.btn-danger]="g.isActive === 'Y'" [class.btn-success]="g.isActive === 'N'"
                    (click)="toggleStatus(g)">
              <i [class.bi-ban]="g.isActive === 'Y'" [class.bi-check-circle]="g.isActive === 'N'"></i>
            </button>

            <!-- optional hard delete -->
            <!-- <button class="btn btn-outline-danger btn-sm ms-2" (click)="deleteGroup(g)">
              <i class="bi bi-trash"></i>
            </button> -->
          </td>
        </tr>

        <tr *ngIf="pagedGroups.length === 0">
          <td colspan="6" class="text-center text-muted py-3">No records found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Page size + pagination -->
  <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
    <div class="d-flex align-items-center mb-2">
      <label class="me-2 small">Rows per page:</label>
      <select class="form-select form-select-sm w-auto" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
        <option *ngFor="let s of [5,10,20,50,100]" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="mb-2">
      <app-pagination [totalItems]="totalItems" [pageSize]="pageSize" [currentPage]="currentPage"
                      (pageChanged)="onPageChanged($event)"></app-pagination>
    </div>
  </div>
</div>
