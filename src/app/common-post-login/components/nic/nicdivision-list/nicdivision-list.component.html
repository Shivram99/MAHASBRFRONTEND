<div class="container-fluid mt-4">

  <!-- Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-primary mb-2">NIC Division List</h4>

    <button class="btn btn-success btn-sm px-3 mb-2" (click)="startAdd()">
      <i class="bi bi-plus-circle"></i> Add Division
    </button>
  </div>

  <!-- Inline Add / Edit Form -->
  <div *ngIf="showForm" class="card p-3 mb-3 shadow-sm">

    <h5 class="mb-3">{{ isEditMode ? 'Edit Division' : 'Add Division' }}</h5>

    <form [formGroup]="divisionForm">

      <div class="row g-3">

        <div class="col-md-4 col-sm-6">
          <label class="form-label">Division Code *</label>
          <input type="text" class="form-control"
                 formControlName="divisionCode"
                 [readonly]="isEditMode">
        </div>

        <div class="col-md-6 col-sm-6">
          <label class="form-label">Description *</label>
          <input type="text" class="form-control"
                 formControlName="description">
        </div>

        <div class="col-md-4 col-sm-6">
          <label class="form-label">Category *</label>
          <select class="form-select" formControlName="categoryCode">
            <option value="">Select Category</option>
            <option *ngFor="let c of categories" [value]="c.categoryCode">
              {{ c.categoryCode }} - {{ c.description }}
            </option>
          </select>
        </div>

      </div>

      <div class="mt-3">
        <button class="btn btn-primary btn-sm" (click)="saveDivision()">Save</button>
        <button class="btn btn-warning btn-sm ms-2" (click)="cancelForm()">Cancel</button>
      </div>

    </form>
  </div>

  <!-- Filters -->
  <div class="row g-3 mb-3">

    <div class="col-md-4 col-sm-6">
      <input type="text"
             class="form-control form-control-sm"
             placeholder="Search by code or description"
             [(ngModel)]="searchText"
             (input)="onSearchChange()">
    </div>

    <div class="col-md-4 col-sm-6">
      <select class="form-select form-select-sm"
              [(ngModel)]="selectedCategory"
              (change)="filterByCategory()">
        <option value="">All Categories</option>
        <option *ngFor="let c of categories" [value]="c.categoryCode">
          {{ c.categoryCode }} - {{ c.description }}
        </option>
      </select>
    </div>

  </div>

  <!-- Table -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover align-middle">

      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Division Code</th>
          <th>Description</th>
          <th>Category</th>
          <th>Status</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let d of pagedDivisions; let i = index">
          <td>{{ ((currentPage - 1) * pageSize) + i + 1 }}</td>
          <td class="text-wrap">{{ d.divisionCode }}</td>
          <td class="text-wrap">{{ d.description }}</td>
          <td class="text-wrap">{{ d.categoryCode }}</td>

          <td>
            <span class="badge px-2 py-1"
                  [class.bg-success]="d.isActive === 'Y'"
                  [class.bg-danger]="d.isActive === 'N'">
              {{ d.isActive === 'Y' ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-2"
                    (click)="editDivision(d)">
              <i class="bi bi-pencil-square"></i>
            </button>

            <button class="btn btn-sm"
                    [class.btn-danger]="d.isActive === 'Y'"
                    [class.btn-success]="d.isActive === 'N'"
                    (click)="toggleStatus(d)">
              <i [class.bi-ban]="d.isActive === 'Y'"
                 [class.bi-check-circle]="d.isActive === 'N'"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="pagedDivisions.length === 0">
          <td colspan="6" class="text-center text-muted py-3">
            No records found
          </td>
        </tr>

      </tbody>

    </table>
  </div>

  <!-- Pagination -->
  <div class="mt-3 d-flex justify-content-center">
    <app-pagination
      [totalItems]="totalItems"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      (pageChanged)="onPageChanged($event)">
    </app-pagination>
  </div>

</div>
