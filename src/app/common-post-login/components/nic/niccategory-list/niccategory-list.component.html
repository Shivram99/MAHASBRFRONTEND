<div class="container-fluid mt-4">

  <!-- Header Row -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-primary">NIC Category List</h4>

    <button class="btn btn-success btn-sm px-3" (click)="startAdd()">
      <i class="bi bi-plus-circle"></i> Add Category
    </button>
  </div>

  <!-- Inline Add / Edit Form -->
  <div *ngIf="showForm" class="card p-3 mb-3 shadow-sm">

    <h5 class="fw-semibold mb-3">{{ isEditMode ? 'Edit Category' : 'Add Category' }}</h5>

    <form [formGroup]="categoryForm">

      <div class="row">

        <!-- Category Code -->
        <div class="col-md-4 mb-3">
          <label class="form-label">Category Code *</label>
          <input type="text" class="form-control"
                 formControlName="categoryCode"
                 [readonly]="isEditMode">
        </div>

        <!-- Description -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Description *</label>
          <input type="text" class="form-control"
                 formControlName="description">
        </div>

      </div>

      <button type="button" class="btn btn-primary btn-sm" (click)="saveCategory()">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>

      <button type="button" class="btn btn-warning btn-sm ms-2" (click)="cancelForm()">
        Cancel
      </button>

    </form>
  </div>

  <!-- Search Box -->
  <div class="row mb-3">
    <div class="col-md-4">
      <input type="text" class="form-control form-control-sm"
             placeholder="🔍 Search by code or description..."
             [(ngModel)]="searchText"
             (input)="onSearchChange()">
    </div>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="loader-overlay d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
  </div>

  <!-- Table -->
  <div class="table-responsive shadow-sm rounded" *ngIf="!loading">
    <table class="table table-hover align-middle">
      <thead class="table-light sticky-top">
        <tr>
          <th>#</th>
          <th>Category Code</th>
          <th>Description</th>
          <th>Status</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of pagedCategories; let i = index">
          <td>{{ ((currentPage - 1) * pageSize) + i + 1 }}</td>
          <td>{{ item.categoryCode }}</td>
          <td>{{ item.description }}</td>

          <td>
            <span class="badge px-3 py-2"
                  [class.bg-success]="item.isActive === 'Y'"
                  [class.bg-danger]="item.isActive === 'N'">
              {{ item.isActive === 'Y' ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-2"
                    (click)="editCategory(item)">
              <i class="bi bi-pencil-square"></i>
            </button>

            <button class="btn btn-sm"
                    [class.btn-danger]="item.isActive === 'Y'"
                    [class.btn-success]="item.isActive === 'N'"
                    (click)="toggleStatus(item)">
              <i [class.bi-ban]="item.isActive === 'Y'"
                 [class.bi-check-circle]="item.isActive === 'N'"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="pagedCategories.length === 0">
          <td colspan="5" class="text-center text-muted py-3">No Records Found</td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- Pagination + Page Size -->
  <div class="d-flex justify-content-between align-items-center mt-3">

    <div>
      <label class="me-2 small fw-semibold">Rows per page:</label>
      <select [(ngModel)]="pageSize" (change)="setPage(1)"
              class="form-select form-select-sm w-auto d-inline-block">
        <option *ngFor="let size of [5, 10, 20, 50]" [value]="size">
          {{ size }}
        </option>
      </select>
    </div>

    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="setPage(currentPage - 1)">
            Prev
          </button>
        </li>

        <li class="page-item"
            *ngFor="let p of [].constructor(totalPages); let i = index"
            [class.active]="currentPage === i + 1">
          <button class="page-link" (click)="setPage(i + 1)">
            {{ i + 1 }}
          </button>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="setPage(currentPage + 1)">
            Next
          </button>
        </li>
      </ul>
    </nav>

  </div>

</div>
