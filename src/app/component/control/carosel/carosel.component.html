<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <!-- <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div> -->

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div
      *ngFor="let image of images; let isFirst = first; trackBy: trackByImage"
      class="carousel-item"
      [class.active]="isFirst"
    >
      <img
        [src]="image"
        alt="banner image"
        class="d-block"
        [attr.loading]="isFirst ? 'eager' : 'lazy'"
        [attr.fetchpriority]="isFirst ? 'high' : 'low'"
        decoding="async"
      />
    </div>
  </div>

  <!-- Left and right controls/icons -->
  <button *ngIf="images.length > 1" class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button *ngIf="images.length > 1" class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
