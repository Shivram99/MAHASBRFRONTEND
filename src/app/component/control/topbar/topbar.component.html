<div class="darkblue py-2">
  <div class="container topbar-inner">
    <!-- Empty left column: balances the right panel so the emblem stays centred when there is room -->
    <div class="topbar-side topbar-spacer" aria-hidden="true"></div>

    <div class="emblem">
      <img [src]="emblemImg" [alt]="'TOPBAR.EMBLEM_ALT' | translate">
    </div>

    <div class="topbar-side rightPannel">
      <ul class="accessibility-menu posHome m-0" *ngIf="currentLanguage$ | async as currentLanguage">
        <ng-container *ngIf="currentUser$ | async as currentUser">
          <li class="user-info-group">
            <div class="logged-user-info">
              <div class="user-fullname" [title]="getDisplayedName(currentUser)">
                {{ getDisplayedName(currentUser) }}
              </div>

              <div class="user-role" *ngIf="getDisplayedRole(currentUser) as displayedRole" [title]="displayedRole">
                {{ displayedRole }}
              </div>
            </div>
          </li>
        </ng-container>

        <li>
          <div class="font-size-controls" role="group" [attr.aria-label]="'ACCESSIBILITY.FONT_CONTROLS_ARIA_LABEL' | translate">
            <button
              type="button"
              class="font-size-btn"
              [attr.aria-label]="'ACCESSIBILITY.DECREASE_FONT' | translate"
              (click)="decreaseFontSize()"
            >
              {{ getFontControlLabel(currentLanguage, 'decrease') }}
            </button>
            <button
              type="button"
              class="font-size-btn"
              [attr.aria-label]="'ACCESSIBILITY.RESET_FONT' | translate"
              (click)="resetFontSize()"
            >
              {{ getFontControlLabel(currentLanguage, 'reset') }}
            </button>
            <button
              type="button"
              class="font-size-btn"
              [attr.aria-label]="'ACCESSIBILITY.INCREASE_FONT' | translate"
              (click)="increaseFontSize()"
            >
              {{ getFontControlLabel(currentLanguage, 'increase') }}
            </button>
          </div>
        </li>

        <li>
          <a
            href="#"
            class="lang-toggle"
            [attr.aria-label]="'LANGUAGE.SWITCHER_ARIA_LABEL' | translate"
            (click)="$event.preventDefault(); toggleLanguage(currentLanguage)"
          >
            {{ currentLanguage === 'en' ? 'English' : 'मराठी' }}
          </a>
        </li>

        <li class="text-light">|</li>

        <li>
          <a *ngIf="!(isLoggedIn$ | async)" [routerLink]="['/login']">
            {{ 'BUTTON.LOGIN' | translate }}
          </a>
        </li>

        <li class="header-date-time">
          {{ currentDateTime | date:'dd-MM-yyyy hh:mm:ss a' }}
        </li>
      </ul>
    </div>
  </div>
</div>
